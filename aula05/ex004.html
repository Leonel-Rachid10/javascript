<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font: normal 20pt arial;
        }
    </style>
</head>
<body>
  
    <script>
      var nome = window.prompt('qual e o seu nome?')
      document.writeln(` Ola, <strong> ${nome}</strong>!seu nome tem  ${nome.length} letras. `)
      document.writeln(`Seu nome em Maiusculas e ${nome.toUpperCase()}`)
        document.writeln(`Seu nome em Minusculas e ${nome.toLowerCase()}`)  
    </script>
</body>
</html>
